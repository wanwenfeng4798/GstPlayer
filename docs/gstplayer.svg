<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- 渐变定义：从 Flutter 蓝到 GStreamer 绿 -->
    <linearGradient id="gst-flutter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#027DFD"/>
      <stop offset="60%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <linearGradient id="flutter-wing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0175C2"/>
      <stop offset="100%" stop-color="#02569B"/>
    </linearGradient>

    <!-- 柔和 Glow 阴影 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LOGO 图标部分 (Flutter 菱形切片 + GStreamer 管道/播放结合) -->
  <g transform="translate(15, 10)">
    <!-- 背景 Flutter 风格左翼切片 -->
    <path d="M 15,20 L 45,50 L 15,80 L 30,80 L 60,50 L 30,20 Z" 
          fill="url(#flutter-wing)" opacity="0.85"/>

    <!-- 主体播放管道箭头 (Flutter shape morphing into Play Arrow) -->
    <path d="M 40,20 L 70,50 L 40,80 L 60,80 L 100,50 L 60,20 Z" 
          fill="url(#gst-flutter-grad)" filter="url(#soft-glow)"/>

    <!-- 流动节点代表 GStreamer 管道数据流 -->
    <circle cx="100" cy="50" r="5" fill="#00E676" filter="url(#soft-glow)"/>
  </g>

  <!-- LOGO 文字部分 -->
  <g transform="translate(140, 72)">
    <!-- 主标题 -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="44" fill="#0F172A" letter-spacing="-0.8">
      Gst<tspan fill="#00C853">Player</tspan>
    </text>

    <!-- 技术栈角标 -->
    <text x="2" y="20" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" font-size="11" fill="#64748B" letter-spacing="1.8">
      FLUTTER &amp; GSTREAMER ENGINE
    </text>
  </g>
</svg>
