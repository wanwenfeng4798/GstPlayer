name: gstplayer
description: "A polished, all-in-one Flutter video player powered by GStreamer — beautiful built-in controls and broad format support for local and network video on mobile and desktop."
version: 0.0.3
homepage: https://github.com/wanwenfeng4798/GstPlayer
repository: https://github.com/wanwenfeng4798/GstPlayer
issue_tracker: https://github.com/wanwenfeng4798/GstPlayer/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  ffi: ^2.2.0
  screen_brightness: ^2.1.11

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  plugin:
    platforms:
      android:
        package: com.gstplayer
        pluginClass: GstPlayerPlugin
        ffiPlugin: true
      ios:
        pluginClass: GstPlayerPlugin
        ffiPlugin: true
      macos:
        pluginClass: GstPlayerPlugin
        ffiPlugin: true
      windows:
        pluginClass: GstPlayerPluginCApi
      linux:
        pluginClass: GstPlayerPlugin
